{{define "content"}}
<h1><img class="icon" src="{{static "icon-key.svg"}}" alt="" width="24" height="24">Sign in</h1>
<p>Press the button to finish signing in. The link in your email works once and expires fifteen minutes after it was sent.</p>
<form method="post" action="/auth/verify">
<input type="hidden" name="token" value="{{.Data}}">
<button class="nes-btn is-primary" type="submit">Sign in</button>
</form>
{{end}}
