{{define "content"}}
<h1>Sign in</h1>
<p>No passwords. Enter your email and we send a one-time sign-in link. First sign-in creates your bench.</p>
<form method="post" action="/auth/start">
<label>Email <input type="email" name="email" required maxlength="200" autocomplete="email"></label>
<button type="submit">Send my link</button>
</form>
{{end}}
